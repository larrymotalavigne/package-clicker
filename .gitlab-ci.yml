# Pipeline definition for packageclicker — frontend-only Angular SPA.

include:
  - project: 'atomstudios/ci-template'
    ref: main
    file: '/pipelines/frontend-only.yml'

variables:
  APP_NAME: packageclicker
  APP_DEPLOYMENT: packageclicker-web
  APP_FRONTEND_URL: https://packageclicker.atomstudios.fr
  # Image pushed at ${CI_REGISTRY_IMAGE} directly (no /suffix).
  APP_IMAGE_NO_SUFFIX: "true"

lint-frontend: { extends: .lint_frontend }
build:         { extends: .build_web }
deploy:        { extends: .deploy_web }
verify:        { extends: .verify }
